syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";

option go_package = "gen/user/v1;userv1";

// ── Service ───────────────────────────────────────────────────────────────────

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users"
      body: "*"
      response_body: "user"
    };
  }

  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{id}"
      response_body: "user"
    };
  }

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/v1/users"
      // query params: ?page=1&per_page=20&status=active
      // no body — GET requests don't have one
    };
  }

  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {delete: "/api/v1/users/{id}"};
  }

  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {get: "/api/v1/roles"};
  }

  rpc GetUserRoles(GetUserRolesRequest) returns (GetUserRolesResponse) {
    option (google.api.http) = {get: "/api/v1/users/{user_id}/roles"};
  }

  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse) {
    option (google.api.http) = {put: "/api/v1/users/{user_id}/roles/{role}"};
  }

  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse) {
    option (google.api.http) = {delete: "/api/v1/users/{user_id}/roles/{role}"};
  }
}

// ── Request messages ──────────────────────────────────────────────────────────

message CreateUserRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
}

message GetUserRequest {
  string id = 1;
}

// ListUsersRequest fields map to HTTP query parameters automatically
// when used with grpc-gateway — no body annotation needed on GET.
message ListUsersRequest {
  int32 page = 1; // default 1
  int32 per_page = 2; // default 20, max 100
  string status = 3; // optional filter: "active" | "suspended"
}

// DeleteUserRequest is separate from GetUserRequest so the two RPCs
// can evolve independently — e.g. adding a `reason` field to delete
// without affecting get.
message DeleteUserRequest {
  string id = 1;
}

message AuthenticateRequest {
  string email = 1;
  string password = 2;
}

message ListRolesRequest {}

message GetUserRolesRequest {
  string user_id = 1;
}

message AssignRoleRequest {
  string user_id = 1;
  string role = 2;
}

message RevokeRoleRequest {
  string user_id = 1;
  string role = 2;
}

// ── Response messages ─────────────────────────────────────────────────────────

message User {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  bool is_active = 6;
  repeated string roles = 7;
}

message Role {
  string id = 1;
  string name = 2;
  string description = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  int64 total_items = 2;
  int32 total_pages = 3;
  int32 page = 4;
  int32 per_page = 5;
}

// DeleteUserResponse carries a success flag rather than returning the
// deleted User — the record is soft-deleted so returning it would be
// misleading (is_active would be false, deleted=true).
message DeleteUserResponse {
  bool success = 1;
}

message AuthenticateResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message ListRolesResponse {
  repeated Role roles = 1;
}

message GetUserRolesResponse {
  repeated Role roles = 1;
}

message AssignRoleResponse {
  User user = 1;
}

message RevokeRoleResponse {
  User user = 1;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserResponse {
  User user = 1;
}
